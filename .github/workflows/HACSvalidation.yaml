# HACS validation Action as per https://hacs.xyz/docs/publish/action/

name: HACS validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    # HACS rejects repositories that are not the published default.
    # Forks otherwise fail this workflow on every upstream merge.
    if: github.repository == 'ha-warmup/warmup'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
